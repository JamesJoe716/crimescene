name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          # The end-to-end test builds its own repository, but a full checkout
          # keeps `git` behaving the same way it does for a real user.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Runs the action on this repository — dogfooding and an end-to-end test of
  # action.yml in one. If the action breaks, CI goes red here.
  dogfood:
    name: analyse this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # crimescene reads history; a shallow clone would truncate it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Run crimescene
        id: scene
        uses: ./
        with:
          top: '12'
          # A young repository has no coupling signal yet; keep the gate off
          # until there is enough history for the score to mean anything.
          fail-above: ''

      - name: Check the action produced its outputs
        run: |
          set -euo pipefail
          echo "worst: ${{ steps.scene.outputs.top-hotspot-path }} @ ${{ steps.scene.outputs.top-hotspot-score }}"
          test -n "${{ steps.scene.outputs.top-hotspot-path }}"
          test -n "${{ steps.scene.outputs.top-hotspot-score }}"
          test -f "${{ steps.scene.outputs.report-html }}"
